name: Verify YoutubeBot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Linux media libraries
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libegl1 libopengl0 libxkbcommon0 libpulse0
      - name: Install test dependencies
        run: |
          npm ci
          python -m pip install -r requirements-desktop.txt
      - name: Verify preserved and new workflows
        run: npm run verify
