<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Audio Capture</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.8);
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .setting-label {
      font-size: 12px;
      color: var(--text);
    }
    input[type="text"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      box-sizing: border-box;
      margin-top: 4px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .history-list {
      max-height: 100px;
      overflow-y: auto;
      font-size: 11px;
    }
    .history-item {
      padding: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--muted);
      word-break: break-all;
    }
    .clear-btn {
      background: transparent;
      border: none;
      color: #f43f5e;
      font-size: 11px;
      cursor: pointer;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ChatGPT Audio Capture</h1>
  </div>
  <div class="card">
    <div class="setting-row">
      <span class="setting-label">Auto Download</span>
      <input type="checkbox" id="autoDownload" checked>
    </div>
    <div style="margin-top: 6px;">
      <label class="setting-label" for="prefix">Filename Prefix</label>
      <input type="text" id="prefix" value="chatgpt-tts">
    </div>
    <div style="margin-top: 6px;">
      <label class="setting-label" for="template">Filename Pattern</label>
      <input type="text" id="template" value="{prefix}_{date}_{title}">
    </div>
    <div style="margin-top: 6px;">
      <label class="setting-label" for="subfolder">Subfolder (optional)</label>
      <input type="text" id="subfolder" placeholder="e.g. chatgpt-audio">
    </div>
  </div>

  <div class="card">
    <div class="history-header">
      <span>Recent Captures</span>
      <button class="clear-btn" id="clearHistory">Clear</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-item">No captures yet</div>
    </div>
  </div>

  <div class="status-badge">
    <span class="dot"></span>
    <span>Status: Ready</span>
  </div>
  <script src="src/popup.js" type="module"></script>
</body>
</html>
